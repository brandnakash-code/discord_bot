``name: Deploy bot

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build bot
        run: |
          source "$HOME/.cargo/env"
          cargo build --release

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Transfer executable to VM
        run: |
          scp -i ~/.ssh/deploy_key \
            target/release/discord_bot \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/discord_bot_new

      - name: Deploy and restart bot
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
          sudo mv /tmp/discord_bot_new /home/github-runner/discord_bot/discord_bot
          sudo chmod +x /home/github-runner/discord_bot/discord_bot
          sudo systemctl restart discord-bot
          EOF``
