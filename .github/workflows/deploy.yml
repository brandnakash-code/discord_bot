name: Deploy bot

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build bot
        run: cargo build --release

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          cat << 'EOF' > ~/.ssh/deploy_key
          ${{ secrets.DEPLOY_SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.DEPLOY_PORT }} -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Transfer executable to VM
        run: |
          scp -P ${{ secrets.DEPLOY_PORT }} -i ~/.ssh/deploy_key \
            target/release/discord_bot \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/discord_bot_new

      - name: Deploy and restart bot
        run: |
          ssh -p ${{ secrets.DEPLOY_PORT }} -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
          sudo mv /tmp/discord_bot_new /home/github-runner/discord_bot/discord_bot
          sudo chmod +x /home/github-runner/discord_bot/discord_bot
          sudo systemctl restart discord-bot
          EOF
